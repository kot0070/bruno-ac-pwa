name: PR22 Catalog Job Lifecycle Integrity

on:
  push:
    branches:
      - feature/financial-integrity-texas-acr-docs

permissions:
  contents: write

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/financial-integrity-texas-acr-docs
      - name: Apply catalog-job lifecycle patch
        run: python scripts/pr22_catalog_job_lifecycle.py
      - name: Run financial integrity suite
        run: node tests/financial-integrity.test.js
      - name: Run calculator dual-pricing suite
        run: node tests/ac-calculator-pricing.test.js
      - name: Syntax check core and calculator
        run: |
          node --check financial-integrity-core.js
          node --check ac-calculator-engine.js
          node --check ac-calculator.js
          node --check ac-calculator-ux.js
          node --check sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S)
          Path('/tmp/bruno-inline.js').write_text('\n'.join(b for b in blocks if b.strip()))
          PY
          if ! node --check /tmp/bruno-inline.js; then
            nl -ba /tmp/bruno-inline.js | sed -n '3085,3135p'
            exit 1
          fi
      - name: Verify lifecycle invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          c=Path('financial-integrity-core.js').read_text()
          t=Path('tests/ac-calculator-pricing.test.js').read_text()
          assert 'mats[mi].unitCost = price' not in s
          assert 'mats[mi].unitCost = row.unitCost' not in s
          assert "else if (row.yourCost == null || row.yourCost === '') row.yourCost = window.BrunoFinancial.normalizePersistentFinancial(row.unitCost, 0)" not in s
          assert 'setCatalogCustomerPrice(state, cid' in s
          assert 'function setCatalogCustomerPrice(state, catalogId, rawValue)' in c
          assert 'Catalog -> historical Job lifecycle' in t
          assert 'customer-price-fallback' in s
          PY
      - name: Commit corrected production tree and cleanup runners
        run: |
          rm -f scripts/pr22_catalog_job_lifecycle.py .github/workflows/pr22-catalog-job-lifecycle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add financial-integrity-core.js index.html tests/ac-calculator-pricing.test.js tests/financial-integrity.test.js scripts/pr22_catalog_job_lifecycle.py .github/workflows/pr22-catalog-job-lifecycle.yml
          git commit -m "Enforce catalog-job pricing lifecycle boundary"
          git push origin HEAD:feature/financial-integrity-texas-acr-docs
