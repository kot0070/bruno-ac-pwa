name: Service Journal v2 validation
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Service Journal UX
        run: node tests/service-journal-ux.test.js
      - name: Financial integrity
        run: node tests/financial-integrity.test.js
      - name: Calculator review UX
        run: node tests/ac-calculator-review-ux.test.js
      - name: Syntax checks
        run: |
          node --check service-journal-ux.js
          node --check navigation-v2.js
          node --check workspace-v5.js
