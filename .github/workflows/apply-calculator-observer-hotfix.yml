name: Apply calculator observer hotfix
on:
  push:
    branches:
      - hotfix/calculator-bom-observer-loop
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/calculator-bom-observer-loop
      - name: Apply targeted runtime fixes
        shell: python
        run: |
          from pathlib import Path

          ux = Path('ac-calculator-ux.js')
          s = ux.read_text()
          old = """function decorateBomRows(){
  document.querySelectorAll('#bomBody tr').forEach(function(row){var req=row.children[1],money=row.querySelectorAll('.col-money');if(!req||money.length<2)return;var old=req.querySelector('.phase1-mobile-price');if(old)old.remove();var d=document.createElement('div');d.className='phase1-mobile-price';var unit=money[0].textContent.trim(),ext=money[1].textContent.trim();d.textContent='Unit '+unit+' · Ext '+ext;if(/\\$0(?:\\.00)?\\b/.test(unit)||/\\$0(?:\\.00)?\\b/.test(ext))d.classList.add('zero');req.appendChild(d)})
}
"""
          new = """function decorateBomRows(){
  document.querySelectorAll('#bomBody tr').forEach(function(row){
    var req=row.children[1],money=row.querySelectorAll('.col-money');if(!req||money.length<2)return;
    var unit=money[0].textContent.trim(),ext=money[1].textContent.trim();
    var text='Unit '+unit+' · Ext '+ext;
    var zero=/\\$0(?:\\.00)?\\b/.test(unit)||/\\$0(?:\\.00)?\\b/.test(ext);
    var d=req.querySelector('.phase1-mobile-price');
    if(!d){d=document.createElement('div');d.className='phase1-mobile-price';req.appendChild(d)}
    if(d.textContent!==text)d.textContent=text;
    d.classList.toggle('zero',zero);
  })
}
"""
          if old not in s:
              raise SystemExit('decorateBomRows target not found')
          s = s.replace(old, new, 1)

          old_init = """  var code=$('codeChecks'),bom=$('bomBody');if(code)new MutationObserver(function(){if(calculatedOnce&&!dirty)render()}).observe(code,{childList:true,subtree:true});if(bom){new MutationObserver(function(){decorateBomRows();if(calculatedOnce&&!dirty)render()}).observe(bom,{childList:true,subtree:true});bom.addEventListener('change',function(e){if(e.target.classList.contains('bomsel')&&calculatedOnce&&!dirty)render()})}
  updateGroupStates(true);decorateBomRows();setState('initial');
"""
          new_init = """  var code=$('codeChecks'),bom=$('bomBody');if(code)new MutationObserver(function(){if(calculatedOnce&&!dirty)render()}).observe(code,{childList:true,subtree:true});if(bom){decorateBomRows();var bomObserver=new MutationObserver(function(){bomObserver.disconnect();decorateBomRows();if(calculatedOnce&&!dirty)render();bomObserver.observe(bom,{childList:true,subtree:true})});bomObserver.observe(bom,{childList:true,subtree:true});bom.addEventListener('change',function(e){if(e.target.classList.contains('bomsel')&&calculatedOnce&&!dirty)render()})}
  updateGroupStates(true);setState('initial');
"""
          if old_init not in s:
              raise SystemExit('BOM observer target not found')
          s = s.replace(old_init, new_init, 1)
          ux.write_text(s)

          nav = Path('navigation-v2.js')
          s = nav.read_text()
          old_show = """function showCalculatorPanel(){
  var existed=!!calculatorPanel;var p=ensureCalculatorPanel();if(!p)return;
  calculatorActive=true;currentGroup='tools';lastByGroup.tools='__calculator';
  var panels=document.querySelectorAll('.panel');for(var i=0;i<panels.length;i++)panels[i].classList.remove('active');p.classList.add('active');
  renderGroups();renderBottom();renderSubnav(getGroup('tools'));schedulePhase2NavMeasure();
  if(existed&&calculatorFrame&&calculatorFrame.dataset.loaded==='1'){try{calculatorFrame.contentWindow.location.reload()}catch(e){}}
  else requestAnimationFrame(syncResultMirror);
}
"""
          new_show = """function showCalculatorPanel(){
  var p=ensureCalculatorPanel();if(!p)return;
  calculatorActive=true;currentGroup='tools';lastByGroup.tools='__calculator';
  var panels=document.querySelectorAll('.panel');for(var i=0;i<panels.length;i++)panels[i].classList.remove('active');p.classList.add('active');
  renderGroups();renderBottom();renderSubnav(getGroup('tools'));schedulePhase2NavMeasure();
  if(calculatorFrame&&calculatorFrame.dataset.loaded==='1'){requestAnimationFrame(function(){syncCalculatorWideClass();fitCalculatorFrame();syncResultMirror()})}
  else requestAnimationFrame(syncResultMirror);
}
"""
          if old_show not in s:
              raise SystemExit('showCalculatorPanel target not found')
          s = s.replace(old_show, new_show, 1)
          nav.write_text(s)

          sw = Path('sw.js')
          s = sw.read_text()
          if "const CACHE = 'bruno-ac-v27';" not in s:
              raise SystemExit('v27 cache marker not found')
          sw.write_text(s.replace("const CACHE = 'bruno-ac-v27';", "const CACHE = 'bruno-ac-v28';", 1))

          wf = Path('.github/workflows/apply-calculator-observer-hotfix.yml')
          wf.unlink()
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stop calculator BOM observer self-loop"
          git push origin HEAD:hotfix/calculator-bom-observer-loop
