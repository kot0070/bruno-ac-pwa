name: Final PR hardening
on:
  push:
    branches:
      - feature/financial-integrity-texas-acr-docs
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and apply final PR patch
        run: |
          git show 17f146a2d520c4a32bb6538510bb997acff44d89:.github/workflows/final-pr-hardening.yml \
            | awk 'found { if ($0 ~ /^[[:space:]]*PY[[:space:]]*$/) exit; sub(/^          /, ""); print } /python3 - <<.PY./ { found=1 }' \
            > /tmp/final-pr-hardening.py
          python3 /tmp/final-pr-hardening.py
      - name: Verify final invariants
        run: |
          node tests/financial-integrity.test.js
          node --check financial-integrity-core.js
          python3 -c "from pathlib import Path; s=Path('index.html').read_text(); assert \"state.tm.laborLines.push({ desc: 'Lead tech', hours: 0, rate: 0, amount: 0 })\" in s; assert 'id=\"tm-validation\"' in s; assert 'id=\"pnl-validation\"' in s; assert 'safeMoney(calc.tm.total)' in s; assert \"var bill = withOHP((state.personnel.burden[0]\" not in s; print('final invariants passed')"
      - name: Commit final PR hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize T&M and profitability financial integrity"
          git push
