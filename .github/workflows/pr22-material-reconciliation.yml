name: PR22 Material Reconciliation

on:
  push:
    branches:
      - feature/financial-integrity-texas-acr-docs

permissions:
  contents: write

jobs:
  implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/financial-integrity-texas-acr-docs
      - name: Apply material reconciliation implementation
        run: |
          python scripts/pr22_material_reconciliation.py
          python scripts/pr22_material_reconciliation_testfix.py
      - name: Run financial integrity tests
        run: node tests/financial-integrity.test.js
      - name: Syntax check core
        run: node --check financial-integrity-core.js
      - name: Syntax check inline application script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S)
          inline='\n'.join(b for b in blocks if b.strip())
          Path('/tmp/bruno-inline.js').write_text(inline)
          PY
          node --check /tmp/bruno-inline.js
      - name: Verify reconciliation and integrity invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          c=Path('financial-integrity-core.js').read_text()
          t=Path('tests/financial-integrity.test.js').read_text()
          forbidden=[
            "row.yourCost = Math.max(0, parseFloat(e.target.value) || 0)",
            "map[String(cat[i].id)] = Number(cat[i].yourCost) || 0",
            "row.yourCost = Number(map[id]) || 0",
            "procurementCostSnapshot: (c.yourCost != null && c.yourCost !== '' ? Number(c.yourCost) : null)",
            "money(calc.le.smallToolsCost || 0)",
          ]
          for x in forbidden:
            assert x not in s, x
          required=[
            'id="pnl-material-reconciliation"',
            'id="pnl-mat-recon-body"',
            'window.BrunoFinancial.reconcileMaterialCosts(state.materialsUsed || [])',
            'row.actualCost = window.BrunoFinancial.normalizePersistentFinancial(row.actualCost, 0)',
            'row.procurementCostSnapshot = window.BrunoFinancial.normalizePersistentFinancial(row.procurementCostSnapshot, 0)',
            "row.procurementCostSnapshot = yc",
            "if (raw === '') delete row.actualCost",
          ]
          for x in required:
            assert x in s, x
          assert 'function reconcileMaterialCosts(rows)' in c
          assert 'reconcileMaterialCosts: reconcileMaterialCosts' in c
          assert "typeof F.resolveMaterialCost === 'function'" in t
          assert 'Material Cost Reconciliation — executable next-phase coverage.' in t
          PY
      - name: Commit production implementation and remove temporary runners
        run: |
          rm -f scripts/pr22_material_reconciliation.py scripts/pr22_material_reconciliation_testfix.py .github/workflows/pr22-material-reconciliation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add financial-integrity-core.js index.html tests/financial-integrity.test.js scripts/pr22_material_reconciliation.py scripts/pr22_material_reconciliation_testfix.py .github/workflows/pr22-material-reconciliation.yml
          git commit -m "Add material cost reconciliation and provenance"
          git push origin HEAD:feature/financial-integrity-texas-acr-docs
