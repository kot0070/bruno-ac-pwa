name: PR22 Final Caller Integrity Fix
on:
  push:
    branches:
      - feature/financial-integrity-texas-acr-docs
jobs:
  corrective:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/financial-integrity-texas-acr-docs
      - name: Apply targeted caller-integrity patch
        run: python scripts/pr22_final_callers_fix.py
      - name: Run financial integrity tests
        run: node tests/financial-integrity.test.js
      - name: Syntax check
        run: node --check financial-integrity-core.js
      - name: Verify caller-side invalid-zero invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          forbidden=[
            's.pnl.actualLabor = asNum(s.pnl.actualLabor)',
            's.pnl.actualEquip = asNum(s.pnl.actualEquip)',
            's.pnl.actualSub = asNum(s.pnl.actualSub)',
            'money(calc.le.smallToolsCost || 0)',
            'b.straight = parseFloat(e.target.value) || 0',
            "var ext = (Number(m.qty) || 0) * (Number(m.unitCost) || 0)",
          ]
          for x in forbidden:
            assert x not in s, x
          required=[
            'normalizePersistentFinancial(s.pnl.actualLabor, 0)',
            'safeMoney(calc.le.smallToolsCost)',
            "var bv=parseFloat(e.target.value); b.straight=(isFinite(bv)&&bv>=0)?bv:e.target.value;",
          ]
          for x in required:
            assert x in s, x
          PY
      - name: Commit corrected production state and remove temporary runner
        run: |
          rm -f scripts/pr22_final_callers_fix.py .github/workflows/pr22-final-callers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix remaining invalid-to-zero caller paths"
          git push origin HEAD:feature/financial-integrity-texas-acr-docs
