name: PR22 Close Acceptance Gaps

on:
  push:
    branches:
      - feature/financial-integrity-texas-acr-docs
    paths:
      - .github/workflows/pr22-close-acceptance-gaps.yml

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/financial-integrity-texas-acr-docs
          fetch-depth: 0

      - name: Apply corrective implementation
        shell: bash
        run: |
          python3 scripts/pr22-temp-implement.py
          sed -i '1d' tests/pr22-lifecycle-integration.test.js
          sed -i 's|assert(src.includes("row.unitCost = (isFinite(cp) && cp >= 0) ? cp : window.BrunoFinancial.INVALID_FINANCIAL"));|assert(src.includes("window.BrunoPricingLifecycle.setCatalogCustomerPrice(state, id, e.target.value)"), "Margins customer price must use strict lifecycle helper");|' tests/financial-integrity.test.js

      - name: Validate syntax and required tests
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/pr22-lifecycle-integration.test.js
          node tests/financial-integrity.test.js
          node tests/ac-calculator-pricing.test.js
          node tests/pr22-lifecycle-integration.test.js
          node -e "const fs=require('fs'),vm=require('vm');const s=fs.readFileSync('index.html','utf8');const b=[...s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(x=>x.trim());if(!b.length)throw new Error('no inline JS blocks');b.forEach((x,i)=>new vm.Script(x,{filename:'index-inline-'+i+'.js'}));"

      - name: Commit production result and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr22-close-acceptance-gaps.yml scripts/pr22-temp-implement.py
          git add index.html tests/financial-integrity.test.js tests/pr22-lifecycle-integration.test.js
          git diff --cached --check
          git commit -m "Close PR22 lifecycle acceptance gaps"
          git push origin HEAD:feature/financial-integrity-texas-acr-docs
