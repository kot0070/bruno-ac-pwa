name: M02 P10 cross-domain final regression
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --no-save jsdom@25
      - name: Runtime bootstrap and loader failures
        run: node tests/sw-register-runtime.test.js
      - name: Commercial bridge runtime
        run: node tests/project-mode-bridge-runtime.test.js
      - name: Review observer runtime
        run: node tests/ac-calculator-review-runtime.test.js
      - name: Compliance UX runtime
        run: node tests/project-compliance-ux-runtime.test.js
      - name: Single-surface DOM
        run: node tests/project-single-surface-dom.test.js
      - name: Runtime summary DOM
        run: node tests/project-runtime-summary.test.js
      - name: Service Journal DOM
        run: node tests/service-journal-dom.test.js
      - name: App backup atomicity
        run: node tests/app-backup-bridge.test.js
      - name: Storage safety
        run: node tests/storage-safety.test.js
      - name: Regulatory source matrix
        run: node tests/code-rule-registry.test.js
      - name: Independent math hand checks
        run: node tests/project-math-handcheck.test.js
      - name: HVAC E2E chain
        run: node tests/project-e2e-chain.test.js
      - name: History core
        run: node tests/project-history-core.test.js
      - name: Compliance gate logic
        run: node tests/project-compliance-gate.test.js
      - name: Catalog pricing
        run: node tests/project-catalog-pricing-engine.test.js
      - name: Mechanical BOM
        run: node tests/project-mechanical-bom-engine.test.js
      - name: Electrical
        run: node tests/project-electrical-engine.test.js
      - name: Equipment
        run: node tests/project-equipment-engine.test.js
      - name: Load
        run: node tests/project-load-engine.test.js
      - name: Building schema
        run: node tests/project-building-schema.test.js
      - name: Estimator core
        run: node tests/project-estimator-core.test.js
      - name: Estimator wiring supplement
        run: node tests/project-estimator-integration.test.js
      - name: Service Journal core
        run: node tests/service-journal-ux.test.js
      - name: Financial integrity
        run: node tests/financial-integrity.test.js
      - name: Calculator pricing
        run: node tests/ac-calculator-pricing.test.js
      - name: Calculator lifecycle
        run: node tests/pr22-lifecycle-integration.test.js
      - name: Calculator review logic
        run: node tests/ac-calculator-review-ux.test.js
      - name: Secondary drain
        run: node tests/secondary-drain-guard.test.js
      - name: Syntax and service worker shell
        run: |
          node --check sw-register.js
          node --check sw.js
          node --check project-mode-bridge.js
          node --check project-building-schema.js
          node --check project-load-engine.js
          node --check project-equipment-engine.js
          node --check project-electrical-engine.js
          node --check project-mechanical-bom-engine.js
          node --check project-catalog-pricing-engine.js
          node --check project-compliance-gate.js
          node --check project-compliance-ux.js
          node --check project-history-core.js
          node --check project-history-v2-bridge.js
          node --check project-runtime-summary.js
          node --check ac-calculator-engine.js
          node --check ac-calculator.js
          node --check ac-calculator-review-ux.js
          node --check financial-integrity-core.js
          node --check service-journal-storage-guard.js
          node --check service-journal-ux.js
          node --check app-backup-bridge.js
          grep -q "const CACHE = 'bruno-ac-v63'" sw.js
          grep -q "./project-compliance-ux.js" sw.js
          grep -q "./project-runtime-summary.js" sw.js
          grep -q "./code-library/hvac-calculation-source-matrix.json" sw.js
