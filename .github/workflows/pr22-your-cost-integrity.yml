name: PR22 Your Cost Integrity Fix
on:
  push:
    branches:
      - feature/financial-integrity-texas-acr-docs
jobs:
  corrective:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/financial-integrity-texas-acr-docs
      - name: Apply direct-cost integrity patch
        run: python scripts/pr22_your_cost_integrity.py
      - name: Run financial integrity tests
        run: node tests/financial-integrity.test.js
      - name: Syntax check
        run: |
          node --check financial-integrity-core.js
          node --check tests/financial-integrity.test.js
      - name: Verify direct-cost invalid-zero invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          forbidden=[
            "row.yourCost = Math.max(0, parseFloat(e.target.value) || 0);",
            "map[String(cat[i].id)] = Number(cat[i].yourCost) || 0;",
            "row.yourCost = Number(map[id]) || 0;",
            "procurementCostSnapshot: (c.yourCost != null && c.yourCost !== '' ? Number(c.yourCost) : null)",
            "var uc = Number(c.unitCost) || 0;",
            "cat[i].yourCost = Number(cat[i].unitCost) || 0;",
          ]
          for x in forbidden:
            assert x not in s, x
          required=[
            "normalizePersistentFinancial(cat[i].yourCost, 0)",
            "normalizePersistentFinancial(map[id], 0)",
            "window.BrunoFinancial.INVALID_FINANCIAL",
            "procurementCostSnapshot: (c.yourCost != null && c.yourCost !== '' ? window.BrunoFinancial.normalizePersistentFinancial(c.yourCost, 0) : null)",
          ]
          for x in required:
            assert x in s, x
          PY
      - name: Commit corrected production state and remove temporary runners
        run: |
          rm -f scripts/pr22_your_cost_integrity.py .github/workflows/pr22-your-cost-integrity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix catalog direct-cost invalid-to-zero lifecycle"
          git push origin HEAD:feature/financial-integrity-texas-acr-docs
