name: PR22 AC Calculator Dual Pricing

on:
  push:
    branches:
      - feature/financial-integrity-texas-acr-docs

permissions:
  contents: write

jobs:
  implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/financial-integrity-texas-acr-docs
      - name: Apply engine pricing implementation
        run: python scripts/pr22_ac_calc_engine_patch.py
      - name: Apply calculator UI and cache implementation
        run: python scripts/pr22_ac_calc_ui_patch.py
      - name: Run existing financial integrity suite
        run: node tests/financial-integrity.test.js
      - name: Run AC Calculator dual-pricing suite
        run: node tests/ac-calculator-pricing.test.js
      - name: Syntax validation
        run: |
          node --check ac-calculator-engine.js
          node --check ac-calculator.js
          node --check ac-calculator-ux.js
          node --check financial-integrity-core.js
          node --check sw.js
      - name: Production invariant checks
        run: |
          python - <<'PY'
          from pathlib import Path
          e=Path('ac-calculator-engine.js').read_text()
          u=Path('ac-calculator.js').read_text()
          h=Path('ac-calculator.html').read_text()
          forbidden=['Number(n)||0','Number(n) || 0','parseFloat(value) || 0','Math.max(0, parseFloat(value) || 0)']
          for x in forbidden:
              assert x not in e, x
              assert x not in u, x
          assert 'unitCost:b.customerUnitPrice,procurementCostSnapshot:b.yourUnitCost' in e
          assert 'procurementCostSource' in e
          assert 'actualCost' not in e
          assert 'Customer Materials' in h and 'Your Material Cost' in h and 'Material Margin %' in h
          assert "const CACHE = 'bruno-ac-v32';" in Path('sw.js').read_text()
          PY
      - name: Commit completed production block and remove temporary implementation files
        run: |
          rm -f scripts/pr22_ac_calc_engine_patch.py scripts/pr22_ac_calc_ui_patch.py .github/workflows/pr22-ac-calculator-dual-pricing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ac-calculator-engine.js ac-calculator.js ac-calculator.html ac-calculator.css sw.js tests/ac-calculator-pricing.test.js scripts/pr22_ac_calc_engine_patch.py scripts/pr22_ac_calc_ui_patch.py .github/workflows/pr22-ac-calculator-dual-pricing.yml
          git commit -m "Add AC Calculator customer and procurement pricing"
          git push origin HEAD:feature/financial-integrity-texas-acr-docs
