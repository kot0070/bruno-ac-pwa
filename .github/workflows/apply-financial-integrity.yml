name: Apply targeted financial integrity phase
on:
  push:
    branches: [feature/financial-integrity-texas-acr-docs]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          def replace_func(name, next_name, body):
              global s
              a = s.find('  function ' + name + '(')
              if a < 0: raise SystemExit('missing function ' + name)
              b = s.find('\n  function ' + next_name + '(', a + 1)
              if b < 0: raise SystemExit('missing next function ' + next_name)
              s = s[:a] + body.rstrip() + '\n' + s[b:]

          # Load deterministic financial core before the legacy application closure.
          once('  <script>\n/* SHIP_MODE: true = customer product UI. */', '  <script src="./financial-integrity-core.js"></script>\n  <script>\n/* SHIP_MODE: true = customer product UI. */', 'core script include')

          # Customer-facing labels and guidance only; no navigation structure changes.
          s = s.replace('>Profit &amp; Loss</button>', '>Job Profitability</button>')
          s = s.replace('<h2>Profit &amp; Loss</h2>', '<h2>Job Profitability / Variance</h2>')
          once('<span class="hint">Quoted / Billed / Actual · materials default → Material Cost</span>', '<span class="hint">Explicit revenue mode · actual job-cost variance</span>', 'pnl hint')
          once('<p class="section-help"><strong>Compare:</strong> Quoted = Summary sales buckets. Billed = T&amp;M detail. Actual Material defaults to Material Cost until you override. Use this to see job variance after work starts.</p>', '<p class="section-help"><strong>Job profitability:</strong> Choose one revenue basis for the whole view: Quoted Contract, T&amp;M Billed, or Actual Collected. Actual material cost uses an explicit override first, then a procurement-cost snapshot when available, then a clearly labelled estimating fallback.</p>', 'pnl help')
          once('<div class="note-box">\n        <strong>Actual Material</strong> defaults to Material Cost (estimate)\n        until you enter actual spend. Quoted buckets = Summary sales. Billed = T&amp;M detail.\n      </div>', '<div class="note-box"><strong>Revenue integrity:</strong> row revenue and total revenue always use the same selected mode. Approved Change Orders are customer-approved sales amounts and are included once in Quoted Contract revenue.</div>\n      <div class="grid grid-2" style="margin-bottom:.75rem">\n        <div class="field"><label>Revenue mode</label><select id="pnl-revenue-mode"><option value="quoted_contract">Quoted Contract</option><option value="tm_billed">T&amp;M Billed</option><option value="actual_collected">Actual Collected</option></select></div>\n        <div class="field"><label>Actual collected revenue $</label><input type="number" id="pnl-actual-collected" step="0.01" min="0" /></div>\n      </div>', 'pnl mode controls')
          s = s.replace('<div class="hdr">Billed (T&amp;M)</div>\n          <div class="hdr">Quoted</div>', '<div class="hdr">Selected Revenue</div>\n          <div class="hdr">Reference</div>', 1)
          s = s.replace('<label>Actual Material $ <span class="badge">default=mat cost</span></label>', '<label>Actual Material $ <span class="badge" id="pnl-mat-source">auto</span></label>', 1)
          s = s.replace(' Link Actual Material to Material Cost', ' Auto Actual Material cost hierarchy', 1)

          # Texas ACR company fields.
          once('<div class="field"><label>License / ACR #</label><input type="text" id="co-license" placeholder="ACR / TACLA #####" /></div>', '<div class="field"><label>ACR Contractor License #</label><input type="text" id="co-license" placeholder="TACLA / TACLB #####" /></div>\n          <div class="field"><label>License Class</label><select id="co-acr-class"><option value="">—</option><option value="A">A</option><option value="B">B</option></select></div>\n          <div class="field"><label>Endorsement</label><select id="co-acr-endorsement"><option value="">—</option><option value="E">E — Environmental Air</option><option value="R">R — Commercial Refrigeration</option><option value="C">C — Combined</option></select></div>\n          <div class="field"><label>License Holder Name (optional)</label><input type="text" id="co-license-holder" /></div>\n          <div class="field"><label>Business Affiliation Reference (optional)</label><input type="text" id="co-affiliation" /></div>', 'acr company fields')
          s = s.replace('<p class="section-help"><strong>Company</strong> stores shop letterheads (legal name, address, license, footer).', '<p class="section-help"><strong>Company</strong> stores Texas ACR customer-document identity (legal/business name, address, phone, ACR license, class/endorsement, footer).', 1)

          # Labor semantics and tool cost classes in static UI.
          once('<p class="section-help"><strong>Costs that feed Summary:</strong> Equipment rows, <strong>small tools line items</strong> (qty × unit cost, summed into Equip Cost), subcontractors, and labor blocks (burden rates come from Workers). Suggested hours from materials are informational.</p>', '<p class="section-help"><strong>Costs that feed Summary:</strong> Equipment rental/direct rows, classified tools/assets, subcontractors, and explicit labor-hour classes. Straight, OT 1.5, OT 2.0 and Holiday hours are entered explicitly; hours/day never auto-creates overtime. Suggested hours remain informational.</p>', 'labor page help')
          s = s.replace('<h3>Small Tools <span class="sub">qty × unit cost · feeds Equip Cost on Summary</span></h3>', '<h3>Tools / Asset Recovery <span class="sub">estimating recovery only · no tax depreciation</span></h3>', 1)
          once('<p class="section-help" style="margin-top:0">HVAC install tools / PPE / A2L accessories. Set qty on this job (defaults 0). Extension = Qty × Unit Cost. The sum is the small-tools dollar amount previously entered as a single field, and is included in <strong>Equip Cost</strong> on Summary.</p>', '<p class="section-help" style="margin-top:0"><strong>Cost class:</strong> Consumable = qty × direct cost; Reusable Tool / Major Equipment = recovery rate × usage; Rental = actual rental cost; Shop Overhead Tool = $0 direct job charge. Legacy rows stay <strong>Legacy direct — review</strong> so historical totals are not silently reclassified. Recovery is for estimating only, not IRS/tax depreciation.</p>', 'tool help')
          once('<tr>\n                <th class="col-qty">Qty</th>\n                <th>Description</th>\n                <th>Supplier</th>\n                <th>Part #</th>\n                <th class="col-cost">Unit cost</th>\n                <th class="col-ext">Extension</th>\n                <th class="col-actions"></th>\n              </tr>', '<tr><th>Class</th><th>Description</th><th>Qty / Usage</th><th>Purchase / Direct $</th><th>Residual $</th><th>Life h</th><th>Maint / h</th><th>Other / h</th><th>Unit</th><th>Recovery / Job Cost</th><th></th></tr>', 'tool table header')
          s = s.replace('<div class="stat"><div class="lbl">Small tools total</div>', '<div class="stat"><div class="lbl">Tools / asset job cost</div>', 1)
          once('<p class="section-help" style="margin-top:0"><strong>Job costing:</strong> Edit <strong>straight</strong> burden only — Sat/Sun/Holiday columns are fixed multipliers (×1.5 / ×2 / ×3) of straight and are not editable. Labor &amp; Equip uses these burden rates. Bill-out columns follow Method A with current OH and profit. Separate from worker take-home pay below.</p>', '<p class="section-help" style="margin-top:0"><strong>Labor Burden</strong> is the internal job-cost rate and may include base wage, employer payroll taxes, workers comp, benefits, PTO allocation, and other labor-specific employer costs. Company rent, general admin/software and general overhead belong in Company OH, not Labor Burden, to avoid double recovery. OT/Holiday columns are reference multipliers; Labor &amp; Equip uses explicit classified hours. Worker take-home tax estimates remain separate.</p>', 'burden semantics')
          once('<p class="section-help"><strong>Pricing engine:</strong> Adjust OH and profit of sales. Final sales price is rounded for the base quote. This is the single margin layer — do not also mark up materials.</p>', '<p class="section-help"><strong>Pricing engine:</strong> Valid Method A behavior is unchanged. Cost and OH must be finite/nonnegative; profit margin must be finite and at least 0% but strictly below 100%. Invalid financial states block Final Sales and customer Quote printing instead of producing a plausible underpriced result.</p>', 'method A help')
          once('</div>\n      <div class="table-wrap" style="margin-top:1.25rem">', '</div>\n      <div class="note-box warn" id="financial-validation" style="display:none" role="alert"></div>\n      <div class="table-wrap" style="margin-top:1.25rem">', 'validation banner')
          once('<p class="section-help"><strong>Time &amp; material:</strong> Invoice total comes from equipment/labor lines plus materials and sub on this page — not from Summary OH&amp;P. Print Invoice uses the active Company letterhead and footer.</p>', '<p class="section-help"><strong>Time &amp; material:</strong> Rates on this page are <strong>customer bill rates</strong>, independent from internal burden/job cost and Method A. Invoice total comes only from T&amp;M detail. Print Invoice uses its own invoice date/number and the active compliant ACR letterhead.</p>', 'tm semantics')

          # Central financial helpers inside legacy closure.
          marker = "  function pct(n) {\n"
          pos = s.find(marker)
          if pos < 0: raise SystemExit('helper insertion marker missing')
          helpers = '''  function finiteFinancial(n) { var x = Number(n); return isFinite(x) ? x : null; }\n  function nonNegativeFinancial(n) { var x = finiteFinancial(n); return x !== null && x >= 0 ? x : null; }\n  function financeError(msg) { return { ok: false, value: null, error: msg }; }\n  function safeMoney(n) { return isFinite(Number(n)) ? money(n) : '—'; }\n  function customerTotalMoney(n) { return isFinite(Number(n)) ? money(n) : '—'; }\n\n'''
          s = s[:pos] + helpers + s[pos:]

          # Explicit labor classes. Legacy blocks migrate preserving their previous dollar semantics once.
          replace_func('laborBlockCost', 'smallToolsLineExt', '''  function laborBlockCost(block, burden) {
    var b = burden[block.burdenIndex] || { straight: 0 };
    var rate = nonNegativeFinancial(b.straight);
    var straight = nonNegativeFinancial(block.straightHours);
    var ot15 = nonNegativeFinancial(block.ot15Hours);
    var ot2 = nonNegativeFinancial(block.ot2Hours);
    var holiday = nonNegativeFinancial(block.holidayHours);
    var holidayMult = nonNegativeFinancial(block.holidayMultiplier == null ? 3 : block.holidayMultiplier);
    if ([rate, straight, ot15, ot2, holiday, holidayMult].some(function (x) { return x === null; })) {
      return { valid:false, error:'Labor hours/rates must be finite and nonnegative.', straightHrs:0, ot15Hrs:0, ot2Hrs:0, holidayHrs:0, totalHrs:0, cost:NaN, rates:{} };
    }
    var cost = straight * rate + ot15 * rate * 1.5 + ot2 * rate * 2 + holiday * rate * holidayMult;
    return { valid:true, straightHrs:straight, ot15Hrs:ot15, ot2Hrs:ot2, holidayHrs:holiday, totalHrs:straight+ot15+ot2+holiday, cost:cost,
      rates:{ straight:rate, ot15:rate*1.5, ot2:rate*2, holiday:rate*holidayMult } };
  }''')

          replace_func('smallToolsLineExt', 'smallToolsCost', '''  function smallToolsLineExt(line) {
    if (!line) return 0;
    var result = window.BrunoFinancial.toolJobCost(line);
    line.recoveryRate = result.ok ? result.rate : null;
    line.recoveryFormula = result.formula || result.error || '';
    return result.ok ? result.cost : NaN;
  }''')

          replace_func('smallToolsCost', 'cloneSmallToolsTemplate', '''  function smallToolsCost(s) {
    var le = (s && s.laborEquip) || {};
    var lines = le.smallToolsLines;
    if (Array.isArray(lines) && lines.length) {
      var sum = 0;
      for (var i = 0; i < lines.length; i++) {
        var ext = smallToolsLineExt(lines[i]);
        if (!isFinite(ext)) return NaN;
        sum += ext;
      }
      le.smallTools = sum;
      return sum;
    }
    var legacy = nonNegativeFinancial(le.smallTools);
    return legacy === null ? NaN : legacy;
  }''')

          replace_func('cloneSmallToolsTemplate', 'calcLaborEquip', '''  function cloneSmallToolsTemplate(src) {
    var list = (src && src.length) ? src : (window.BRUNO_SMALL_TOOLS_TEMPLATE || []);
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var t = list[i] || {};
      out.push({ qty:0, description:t.description||'', unitCost:Number(t.unitCost)||0, supplier:t.supplier||'', part:t.part!=null?String(t.part):'', group:t.group||'', costClass:t.costClass||'CONSUMABLE', recoveryUnit:'hour', residualValue:0, lifeHours:0, maintenancePerHour:0, otherPerHour:0, usage:0, dailyRecoveryRate:0, needsCostClassReview:false });
    }
    return out;
  }''')

          replace_func('withOHP', 'calcSummary', '''  function withOHP(cost, oh, profit) {
    var r = window.BrunoFinancial.methodASales(cost, oh, profit);
    return r.ok ? r.value : NaN;
  }''')

          replace_func('calcSummary', 'calcTM', '''  function calcSummary(s, mats, le) {
    var oh = finiteFinancial(s.summary.ohRate);
    var profit = finiteFinancial(s.summary.profitMargin);
    var errors = [];
    if (oh === null || oh < 0) errors.push('Overhead must be finite and nonnegative.');
    if (profit === null || profit < 0 || profit >= 1) errors.push('Profit margin must be finite, >= 0% and < 100%.');
    var costs = [le.equipCost, le.laborCost, mats.cost, le.subCost];
    if (costs.some(function(x){ return !isFinite(x) || x < 0; })) errors.push('Direct job costs must be finite and nonnegative; use an explicit Credit / Adjustment instead of hidden negative cost rows.');
    var valid = errors.length === 0;
    var buckets = {
      equip: { cost: le.equipCost, sales: valid ? withOHP(le.equipCost, oh, profit) : NaN },
      labor: { cost: le.laborCost, sales: valid ? withOHP(le.laborCost, oh, profit) : NaN },
      material: { cost: mats.cost, sales: valid ? withOHP(mats.cost, oh, profit) : NaN },
      sub: { cost: le.subCost, sales: valid ? withOHP(le.subCost, oh, profit) : NaN }
    };
    var totalCost = buckets.equip.cost + buckets.labor.cost + buckets.material.cost + buckets.sub.cost;
    var totalSales = valid ? buckets.equip.sales + buckets.labor.sales + buckets.material.sales + buckets.sub.sales : NaN;
    if (valid && !isFinite(totalSales)) { valid = false; errors.push('Method A produced a non-finite result.'); }
    var ohAmt = valid ? totalCost * oh : NaN;
    var breakEven = valid ? totalCost + ohAmt : NaN;
    var profitAmt = valid ? totalSales - breakEven : NaN;
    return { valid:valid, errors:errors, oh:oh, profit:profit, buckets:buckets, totalCost:totalCost, totalSales:totalSales, ohAmt:ohAmt, breakEven:breakEven, profitAmt:profitAmt, quoteRounded:valid ? Math.round(totalSales) : null };
  }''')

          replace_func('calcAll', 'save', '''  function calcAll(s) {
    var mats = calcMaterial(s);
    var le = calcLaborEquip(s);
    var sum = calcSummary(s, mats, le);
    var tm = calcTM(s);
    var cos = calcCOs(s);
    var quoteBase = sum.valid ? sum.quoteRounded : null;
    return { mats:mats, le:le, sum:sum, tm:tm, cos:cos, quoteBase:quoteBase, quoteTotal:sum.valid ? quoteBase + cos.approved : null };
  }''')

          # Material, equipment and subcontractor direct cost validation in calculations.
          replace_func('calcMaterial', 'suggestedHours', '''  function calcMaterial(s) {
    var sum = 0, lines = s.materialsUsed || [];
    for (var i=0;i<lines.length;i++) {
      var q = nonNegativeFinancial(lines[i].qty), c = nonNegativeFinancial(lines[i].unitCost);
      if (q === null || c === null) { lines[i].extension = NaN; return { cost:NaN, markup:0, quotedSheet:NaN, valid:false }; }
      lines[i].extension = q * c; sum += lines[i].extension;
    }
    return { cost:sum, markup:0, quotedSheet:sum, valid:true };
  }''')

          # Preserve direct rental rows but reject invalid costs.
          old = "for (var i = 0; i < eqs.length; i++) equipSum += Number(eqs[i].cost) || 0;"
          new = "for (var i = 0; i < eqs.length; i++) { var ec = nonNegativeFinancial(eqs[i].cost); if (ec === null) { equipSum = NaN; break; } equipSum += ec; }"
          once(old,new,'equipment calc validation')
          old = "for (var j = 0; j < subs.length; j++) subSum += Number(subs[j].price) || 0;"
          new = "for (var j = 0; j < subs.length; j++) { var sp = nonNegativeFinancial(subs[j].price); if (sp === null) { subSum = NaN; break; } subSum += sp; }"
          once(old,new,'sub calc validation')

          # Migration: explicit labor-hour fields preserve legacy current semantics; tool rows default LEGACY_DIRECT/manual review.
          migration_anchor = "      row.sunHours = asNum(row.sunHours);\n"
          migration_add = migration_anchor + "      if (row.straightHours == null && row.ot15Hours == null && row.ot2Hours == null) {\n        var lp=asNum(row.persons), ld=asNum(row.days), lh=asNum(row.hoursPerDay);\n        row.straightHours = lp * ld * Math.min(lh, 8);\n        row.ot15Hours = lp * ld * Math.max(lh - 8, 0) + asNum(row.satPersons)*asNum(row.satDays)*asNum(row.satHours);\n        row.ot2Hours = asNum(row.sunPersons)*asNum(row.sunDays)*asNum(row.sunHours);\n        row.holidayHours = 0; row.holidayMultiplier = 3; row.laborModelVersion = 2;\n      }\n      row.straightHours = row.straightHours == null ? 0 : row.straightHours; row.ot15Hours = row.ot15Hours == null ? 0 : row.ot15Hours; row.ot2Hours = row.ot2Hours == null ? 0 : row.ot2Hours; row.holidayHours = row.holidayHours == null ? 0 : row.holidayHours; row.holidayMultiplier = row.holidayMultiplier == null ? 3 : row.holidayMultiplier;\n"
          once(migration_anchor,migration_add,'labor migration')

          tool_anchor = "        if (row.group == null) row.group = '';\n"
          tool_add = tool_anchor + "        if (!row.costClass) { row.costClass = 'LEGACY_DIRECT'; row.needsCostClassReview = true; }\n        if (!row.recoveryUnit) row.recoveryUnit = 'hour';\n        if (row.residualValue == null) row.residualValue = 0; if (row.lifeHours == null) row.lifeHours = 0; if (row.maintenancePerHour == null) row.maintenancePerHour = 0; if (row.otherPerHour == null) row.otherPerHour = 0; if (row.usage == null) row.usage = 0; if (row.dailyRecoveryRate == null) row.dailyRecoveryRate = 0;\n"
          once(tool_anchor,tool_add,'tool migration')

          # Procurement-cost snapshot for new catalog-added materials; quote unitCost remains untouched.
          once("        units: c.units, unitCost: c.unitCost, crew: c.crew || 1, prod: c.prod || 0, prodUnit: c.prodUnit || 'Day',", "        units: c.units, unitCost: c.unitCost, procurementCostSnapshot: (c.yourCost != null && c.yourCost !== '' ? Number(c.yourCost) : null), procurementCostSource: (c.yourCost != null && c.yourCost !== '' ? 'catalog_yourCost_snapshot' : ''), crew: c.crew || 1, prod: c.prod || 0, prodUnit: c.prodUnit || 'Day',", 'procurement snapshot')

          # Company ACR normalization/aliases while retaining generic license compatibility.
          once("    if (!c.license && c.tecl) c.license = c.tecl;", "    if (!c.license && c.tecl) c.license = c.tecl; /* legacy import only */\n    if (!c.acrLicense) c.acrLicense = c.license || '';\n    if (!c.license) c.license = c.acrLicense || '';", 'company license migration')
          once("    if (c.website == null) c.website = '';", "    if (c.website == null) c.website = '';\n    if (c.acrLicense == null) c.acrLicense = c.license || '';\n    if (c.acrClass == null) c.acrClass = '';\n    if (c.acrEndorsement == null) c.acrEndorsement = '';\n    if (c.licenseHolderName == null) c.licenseHolderName = '';\n    if (c.businessAffiliation == null) c.businessAffiliation = '';", 'company acr defaults')
          s = s.replace("    c.tecl = c.license;\n", "    c.license = c.acrLicense || c.license || ''; /* generic backward-compatible export alias */\n", 1)
          once("      license: c.license || '',\n      website:", "      license: c.acrLicense || c.license || '',\n      acrLicense: c.acrLicense || c.license || '',\n      acrClass: c.acrClass || '',\n      acrEndorsement: c.acrEndorsement || '',\n      licenseHolderName: c.licenseHolderName || '',\n      businessAffiliation: c.businessAffiliation || '',\n      website:", 'companyFields ACR')
          once("      license: fields.license || '',\n      website:", "      license: fields.acrLicense || fields.license || '',\n      acrLicense: fields.acrLicense || fields.license || '',\n      acrClass: fields.acrClass || '',\n      acrEndorsement: fields.acrEndorsement || '',\n      licenseHolderName: fields.licenseHolderName || '',\n      businessAffiliation: fields.businessAffiliation || '',\n      website:", 'profile ACR')
          # Apply active profile: inject fields after license.
          s = s.replace("      license: p.license,\n      website: p.website,", "      license: p.acrLicense || p.license,\n      acrLicense: p.acrLicense || p.license,\n      acrClass: p.acrClass || '', acrEndorsement: p.acrEndorsement || '', licenseHolderName: p.licenseHolderName || '', businessAffiliation: p.businessAffiliation || '',\n      website: p.website,", 1)
          # bind/read company UI.
          s = s.replace("      license: p.license,\n      website: p.website,", "      license: p.acrLicense || p.license,\n      acrLicense: p.acrLicense || p.license, acrClass:p.acrClass||'', acrEndorsement:p.acrEndorsement||'', licenseHolderName:p.licenseHolderName||'', businessAffiliation:p.businessAffiliation||'',\n      website: p.website,", 1)
          once("    set('co-license', c.license);", "    set('co-license', c.acrLicense || c.license);\n    set('co-acr-class', c.acrClass); set('co-acr-endorsement', c.acrEndorsement); set('co-license-holder', c.licenseHolderName); set('co-affiliation', c.businessAffiliation);", 'bind ACR UI')
          once("    p.license = g('co-license');", "    p.acrLicense = g('co-license'); p.license = p.acrLicense;\n    p.acrClass = g('co-acr-class'); p.acrEndorsement = g('co-acr-endorsement'); p.licenseHolderName = g('co-license-holder'); p.businessAffiliation = g('co-affiliation');", 'read ACR UI')
          s = s.replace("'co-phone','co-email','co-license','co-website','co-footer'", "'co-phone','co-email','co-license','co-acr-class','co-acr-endorsement','co-license-holder','co-affiliation','co-website','co-footer'", 1)

          # Dedicated exact Texas Department block and blocking customer-document validation.
          qmarker = "  var QUOTE_VALID_TXT = 'This quote is valid for 15 days from the quote date.';\n"
          qadd = qmarker + "  var TDLR_ACR_NOTICE = 'Regulated by The Texas Department of Licensing and Regulation, P.O. Box 12157, Austin, Texas 78711, 1-800-803-9202, 512-463-6599, www.tdlr.texas.gov';\n  function customerDocumentErrors(mode, calc) {\n    var c = letterheadCompany(); var v = window.BrunoFinancial.validateAcrCompany(c); var out = v.missing.slice();\n    if (mode === 'quote' && (!calc || !calc.sum || !calc.sum.valid)) out.push('valid Method A financial inputs');\n    if (mode === 'tm') { var tm=state.tm||{}; if (!String(tm.invoice||'').trim()) out.push('invoice number'); if (!String(tm.date||'').trim()) out.push('invoice date'); }\n    return out;\n  }\n  function tdlrAcrBlock(c) { return '<div class=\"tdlr-acr-block\"><strong>ACR License:</strong> ' + esc(c.acrLicense || c.license || '') + (c.acrClass ? ' · Class ' + esc(c.acrClass) : '') + (c.acrEndorsement ? ' · Endorsement ' + esc(c.acrEndorsement) : '') + '<br>' + esc(TDLR_ACR_NOTICE) + '</div>'; }\n"
          once(qmarker,qadd,'TDLR helpers')

          # Explicit labor UI.
          replace_func('renderLaborBlocks', 'fieldNum', '''  function renderLaborBlocks(calc) {
    var blocks=state.laborEquip.blocks||[], burden=state.personnel.burden||[], html='';
    for (var i=0;i<blocks.length;i++) { var b=blocks[i], bur=burden[b.burdenIndex]||{straight:0,type:'?'}, det=calc.le.blockDetails[i]||{};
      html += '<div class="labor-block card" style="background:var(--bg-input)" data-i="'+i+'"><h3>'+esc(b.label)+' <span class="sub">burden $'+(Number(bur.straight)||0).toFixed(2)+'/hr · '+safeMoney(det.cost)+' · '+(Number(det.totalHrs)||0).toFixed(1)+' h</span></h3><div class="labor-inputs">'+
        fieldNum('Straight hours','lb-straight',b.straightHours)+fieldNum('OT 1.5 hours','lb-ot15',b.ot15Hours)+fieldNum('OT 2.0 hours','lb-ot2',b.ot2Hours)+fieldNum('Holiday hours','lb-holiday',b.holidayHours)+fieldNum('Holiday multiplier','lb-holiday-mult',b.holidayMultiplier)+'</div></div>';
    }
    document.getElementById('labor-blocks').innerHTML=html;
  }''')

          # Tool class UI with visible recovery inputs/formula.
          replace_func('renderSmallTools', 'renderSubs', '''  function renderSmallTools() {
    var tbody=document.getElementById('st-body'); if(!tbody)return; var rows=(state.laborEquip&&state.laborEquip.smallToolsLines)||[], html='';
