name: Apply targeted financial integrity phase
on:
  push:
    branches:
      - feature/financial-integrity-texas-acr-docs
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and apply reviewed one-shot patch
        run: |
          git show b23c4bbcb0540506ad3b2cceb6d0b7b697a71677:.github/workflows/apply-financial-integrity.yml \
            | awk 'found { if ($0 ~ /^[[:space:]]*PY[[:space:]]*$/) exit; sub(/^          /, ""); print } /python3 - <<.PY./ { found=1 }' \
            > /tmp/apply-financial-phase.py
          python3 /tmp/apply-financial-phase.py
      - name: Run deterministic tests
        run: |
          node tests/financial-integrity.test.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          for i,code in enumerate(scripts):
              if not code.strip():
                  continue
              f=Path(f'/tmp/inline-{i}.js')
              f.write_text(code)
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  sys.exit(r.returncode)
          print('inline JavaScript syntax checks passed')
          PY
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden financial integrity and Texas ACR customer documents"
          git push
