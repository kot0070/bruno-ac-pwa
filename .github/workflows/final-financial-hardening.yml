name: Final financial hardening
on:
  push:
    branches:
      - feature/financial-integrity-texas-acr-docs
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and apply final hardening patch
        run: |
          git show b1733ad82c944afa6c96d8b297728c57d96f1ebc:.github/workflows/final-financial-hardening.yml \
            | awk 'found { if ($0 ~ /^[[:space:]]*PY[[:space:]]*$/) exit; sub(/^          /, ""); print } /python3 - <<.PY./ { found=1 }' \
            > /tmp/final-hardening.py
          python3 /tmp/final-hardening.py
      - name: Run tests and syntax checks
        run: |
          node tests/financial-integrity.test.js
          python3 -c "from pathlib import Path; s=Path('index.html').read_text(); assert 'var quoteValid = sum.valid && cos.valid;' in s; assert 'normalizeFinancialValue(s.tm.materialAmount)' in s; assert \"customerTotalMoney(calc.quoteTotal)\" in s; print('source guards passed')"
          node --check financial-integrity-core.js
      - name: Commit final hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close remaining T&M and import financial validation gaps"
          git push
