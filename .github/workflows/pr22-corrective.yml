name: PR22 Corrective Financial Integrity

on:
  push:
    branches:
      - feature/financial-integrity-texas-acr-docs
    paths:
      - .github/workflows/pr22-corrective.yml

permissions:
  contents: write

jobs:
  corrective:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/financial-integrity-texas-acr-docs
          fetch-depth: 0

      - name: Apply narrow corrective patch
        run: python scripts/pr22_corrective.py

      - name: Run deterministic tests and source invariants
        run: |
          node --check financial-integrity-core.js
          node tests/financial-integrity.test.js
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          c=Path('financial-integrity-core.js').read_text()
          required=[
            "var license = String(company.acrLicense || '').trim();",
            "row.straightHours = 'INVALID_LEGACY_LABOR'",
            "Negative Change Orders are not supported",
            "function customerTotalMoney(n) { return validMoneyValue(n) ? money(n) : '—'; }",
            "makeLetterhead(tm.date, 'Invoice date')",
            "mr.actualCost !== null",
            "mr.procurementCostSnapshot !== null",
          ]
          for x in required:
            assert x in s+c, x
          forbidden=[
            "if (!c.license && c.tecl) c.license = c.tecl",
            "if (!c.acrLicense) c.acrLicense = c.license || ''",
            "nonNegative(input.residualValue || 0)",
            "nonNegative(input.maintenancePerHour || 0)",
            "nonNegative(line.usage || 0)",
          ]
          for x in forbidden:
            assert x not in s+c, x
          print('PR22 corrective source invariants passed')
          PY

      - name: Commit corrective patch and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/pr22-corrective.yml scripts/pr22_corrective.py
          git add financial-integrity-core.js index.html tests/financial-integrity.test.js .github/workflows/pr22-corrective.yml scripts/pr22_corrective.py
          git commit -m "Fix PR22 audit blockers"
          git push origin HEAD:feature/financial-integrity-texas-acr-docs
