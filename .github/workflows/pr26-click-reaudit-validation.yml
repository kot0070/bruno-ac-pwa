name: PR26 Click Reaudit Validation
on:
  push:
    branches: [feature/room-based-code-estimator]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/room-estimator-engine.test.js
      - run: node tests/calculation-history-core.test.js
      - run: node tests/pr26-integration-regressions.test.js
      - run: node tests/code-rule-registry.test.js
      - run: node tests/financial-integrity.test.js
      - run: node tests/ac-calculator-pricing.test.js
      - run: node tests/pr22-lifecycle-integration.test.js
      - run: node tests/ac-calculator-review-ux.test.js
      - run: node tests/service-journal-ux.test.js
      - run: |
          node --check room-estimator-engine.js
          node --check room-estimator-live.js
          node --check room-estimator-persistence.js
          node --check room-estimator-preload.js
          node --check calculation-history-core.js
          node --check calculation-history-ux.js
          node --check sw.js
